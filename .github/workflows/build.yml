name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 支持在 GitHub 网页手动点击按钮一键打包

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Fixed Keystore
        uses: actions/cache@v4
        id: keystore-cache
        with:
          path: app/release.keystore
          key: mytv-release-keystore-v1

      - name: Generate Keystore if not cached
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -keystore app/release.keystore -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" -storetype PKCS12

      - name: Build Release APK with Gradle
        run: ./gradlew assembleRelease -PIS_SO_BUILD=false

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}